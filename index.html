<!DOCTYPE html>
<html lang="ja" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>展開・因数分解 | Math Speed Training</title>
  
  <!-- PWA / iOS設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Math Speed">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            mono: ['"SF Mono"', 'Consolas', '"Courier New"', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body { user-select: none; -webkit-user-select: none; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
      .print-card { border: 1px solid #e2e8f0 !important; background: white !important; color: black !important; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- ヘッダー -->
  <header class="no-print bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
    <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-indigo-500/20">
          ∑
        </div>
        <span class="font-bold text-lg tracking-tight text-slate-900 dark:text-white">Math Speed</span>
      </div>
      
      <!-- テーマ切り替えボタン -->
      <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95" title="テーマ切り替え">
        <span id="theme-icon" class="text-xl leading-none">🌙</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 max-w-xl mx-auto w-full">
    
    <!-- モード選択画面 -->
    <div id="mode-select" class="w-full space-y-6">
      
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">展開・因数分解</h1>
        <p class="text-xs font-medium text-slate-500 dark:text-slate-400">難易度を選んでトレーニングを開始してください</p>
      </div>
      
      <!-- 難易度切り替えタブ -->
      <div class="bg-slate-200/70 dark:bg-slate-800/60 p-1.5 rounded-2xl flex gap-1.5 border border-slate-300/40 dark:border-slate-700/40">
        <button id="diff-easy" onclick="setDifficulty('easy')" class="flex-1 py-2.5 rounded-xl font-bold text-xs transition-all">初級</button>
        <button id="diff-normal" onclick="setDifficulty('normal')" class="flex-1 py-2.5 rounded-xl font-bold text-xs transition-all">中級</button>
        <button id="diff-hard" onclick="setDifficulty('hard')" class="flex-1 py-2.5 rounded-xl font-bold text-xs transition-all">上級</button>
      </div>

      <div class="space-y-3">
        <button onclick="startGame('expand')" class="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-bold text-base shadow-lg shadow-indigo-500/25 border-b-4 border-indigo-800 transition active:border-b-0 active:translate-y-1 flex items-center justify-between">
          <span>⚡ 展開スピードトレ</span>
          <span class="text-xs font-normal opacity-80">10問計測</span>
        </button>
        <button onclick="startGame('factor')" class="w-full py-4 px-6 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-bold text-base shadow-lg shadow-emerald-500/25 border-b-4 border-emerald-800 transition active:border-b-0 active:translate-y-1 flex items-center justify-between">
          <span>⚡ 因数分解スピードトレ</span>
          <span class="text-xs font-normal opacity-80">10問計測</span>
        </button>
      </div>

      <div class="pt-4 border-t border-slate-200 dark:border-slate-800 space-y-3">
        <button onclick="showWorksheet()" class="w-full py-3.5 px-6 bg-amber-500/10 hover:bg-amber-500/20 text-amber-600 dark:text-amber-400 border border-amber-500/30 rounded-2xl font-bold text-sm transition flex items-center justify-center gap-2">
          <span>📝 問題集モード（一括表示・印刷）</span>
        </button>
        <button onclick="showDashboard()" class="w-full py-3.5 px-6 bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-2xl font-bold text-sm transition flex items-center justify-center gap-2">
          <span>📊 成績ダッシュボード</span>
        </button>
      </div>
    </div>

    <!-- 1問ずつ回答モード画面 -->
    <div id="game-screen" class="w-full hidden space-y-5">
      <div class="flex justify-between items-center text-xs font-semibold text-slate-500 dark:text-slate-400">
        <span class="bg-amber-500/10 text-amber-600 dark:text-amber-400 px-2.5 py-1 rounded-full border border-amber-500/20">
          <span id="diff-label" class="font-bold">中級</span>
        </span>
        <span class="text-slate-700 dark:text-slate-300">問題 <span id="q-num" class="text-indigo-600 dark:text-indigo-400 font-bold text-sm">1</span> / 10</span>
        <span class="font-mono text-sm bg-slate-200 dark:bg-slate-800 px-3 py-1 rounded-full text-slate-800 dark:text-slate-200"><span id="timer">0.0</span>s</span>
      </div>

      <div id="card" class="bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-none text-center space-y-3">
        <div class="text-xs font-bold text-slate-400 uppercase tracking-wider" id="mode-label">展開しなさい</div>
        <div id="question" class="text-3xl font-black tracking-wide text-slate-900 dark:text-white py-2">--</div>
      </div>

      <div class="space-y-3">
        <input type="text" id="answer-input" placeholder="答えを入力 (例: 6x² + 11x - 35)" class="w-full py-4 px-5 bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-2xl text-center text-lg font-mono text-slate-900 dark:text-white focus:outline-none focus:border-indigo-600 dark:focus:border-indigo-500 shadow-sm transition" autocomplete="off">
        <button onclick="checkAnswer()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-bold text-base shadow-lg shadow-indigo-500/25 border-b-4 border-indigo-800 transition active:border-b-0 active:translate-y-1">
          回答する (Enter)
        </button>
      </div>

      <div id="feedback" class="text-center font-bold h-6 text-sm"></div>
    </div>

    <!-- 問題集モード -->
    <div id="worksheet-screen" class="w-full hidden space-y-6">
      <div class="no-print flex flex-col gap-4">
        <div class="text-center">
          <h2 class="text-xl font-bold text-slate-900 dark:text-white">📝 問題集モード</h2>
          <p class="text-xs text-slate-500">一括で確認・自己採点や印刷ができます</p>
        </div>
        <div class="flex gap-2">
          <button onclick="generateSheet('expand')" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-xs shadow-sm">展開 10問</button>
          <button onclick="generateSheet('factor')" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-xs shadow-sm">因数分解 10問</button>
          <button onclick="generateSheet('mix')" class="flex-1 py-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-bold text-xs shadow-sm">ミックス 10問</button>
        </div>
      </div>

      <div id="sheet-list" class="space-y-3"></div>

      <div class="no-print space-y-3 pt-4 border-t border-slate-200 dark:border-slate-800">
        <button onclick="toggleAnswers()" id="toggle-ans-btn" class="w-full py-3.5 bg-amber-500 text-white rounded-2xl font-bold text-sm shadow-md transition">
          答えをすべて表示する
        </button>
        <button onclick="window.print()" class="w-full py-3.5 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-2xl font-bold text-sm transition">
          🖨️ 印刷する（紙に出力）
        </button>
        <button onclick="showHome()" class="w-full py-3.5 bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 rounded-2xl font-bold text-sm transition">
          ホームに戻る
        </button>
      </div>
    </div>

    <!-- ダッシュボード画面 -->
    <div id="dashboard-screen" class="w-full hidden space-y-6">
      <div class="text-center">
        <h2 class="text-xl font-bold text-slate-900 dark:text-white">📊 成績ダッシュボード</h2>
        <p class="text-xs text-slate-500">これまでのトレーニング記録</p>
      </div>

      <div id="stats" class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-lg shadow-slate-200/50 dark:shadow-none space-y-4">
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3">
          <span class="text-xs font-semibold text-slate-500">総プレイ回数</span>
          <span id="total-plays" class="font-bold text-slate-900 dark:text-white text-base">0 回</span>
        </div>
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3">
          <span class="text-xs font-semibold text-slate-500">ベストタイム</span>
          <span id="best-time" class="font-black text-emerald-600 dark:text-emerald-400 text-lg">-- 秒</span>
        </div>
        <div class="flex justify-between items-center pb-1">
          <span class="text-xs font-semibold text-slate-500">平均クリアタイム</span>
          <span id="avg-time" class="font-bold text-indigo-600 dark:text-indigo-400 text-base">0.0 秒</span>
        </div>
      </div>

      <button onclick="showHome()" class="w-full py-3.5 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-2xl font-bold text-sm transition">
        ホームに戻る
      </button>
    </div>

  </main>

  <script>
    let currentMode = '';
    let currentDifficulty = 'normal';
    let qIndex = 0;
    let startTime = 0;
    let timerInterval = null;
    let currentQuestionData = null;
    let currentSheetData = [];
    let showAnswersFlag = false;

    // テーマ設定（ローカルストレージに保存）
    function initTheme() {
      const savedTheme = localStorage.getItem('math_theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').innerText = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').innerText = '🌙';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('math_theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
    }

    initTheme();

    document.getElementById('answer-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') checkAnswer();
    });

    function setDifficulty(diff) {
      currentDifficulty = diff;
      const btnE = document.getElementById('diff-easy');
      const btnN = document.getElementById('diff-normal');
      const btnH = document.getElementById('diff-hard');

      const activeClass = 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm font-black';
      const inactiveClass = 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-semibold';

      btnE.className = `flex-1 py-2.5 rounded-xl font-bold text-xs transition-all ${diff === 'easy' ? activeClass : inactiveClass}`;
      btnN.className = `flex-1 py-2.5 rounded-xl font-bold text-xs transition-all ${diff === 'normal' ? activeClass : inactiveClass}`;
      btnH.className = `flex-1 py-2.5 rounded-xl font-bold text-xs transition-all ${diff === 'hard' ? activeClass : inactiveClass}`;
    }

    setDifficulty('normal');

    function getRandomNonZero(min, max) {
      let n = 0;
      while (n === 0) n = Math.floor(Math.random() * (max - min + 1)) + min;
      return n;
    }

    function fmtTerm(coeff, varStr, isFirst = false) {
      if (coeff === 0) return '';
      let sign = coeff > 0 ? (isFirst ? '' : '+') : '-';
      let abs = Math.abs(coeff);
      let numStr = (abs === 1 && varStr !== '') ? '' : abs;
      return `${sign}${numStr}${varStr}`;
    }

    function generateExpandQuestion() {
      if (currentDifficulty === 'easy') {
        const a = getRandomNonZero(-8, 8);
        const b = getRandomNonZero(-8, 8);
        const qText = `(x ${a>0?'+ '+a:'- '+Math.abs(a)})(x ${b>0?'+ '+b:'- '+Math.abs(b)})`;
        const sum = a + b, prod = a * b;
        const ans = `x²${fmtTerm(sum, 'x')}${fmtTerm(prod, '')}`;
        return { text: qText, answer: ans, type: '展開' };
      } 
      else if (currentDifficulty === 'normal') {
        const a = Math.floor(Math.random() * 4) + 2;
        const c = Math.floor(Math.random() * 3) + 1;
        const b = getRandomNonZero(-6, 6);
        const d = getRandomNonZero(-6, 6);
        
        const qText = `(${fmtTerm(a,'x',true)} ${b>0?'+ '+b:'- '+Math.abs(b)})(${fmtTerm(c,'x',true)} ${d>0?'+ '+d:'- '+Math.abs(d)})`;
        const A = a * c;
        const B = a * d + b * c;
        const C = b * d;
        const ans = `${fmtTerm(A,'x²',true)}${fmtTerm(B,'x')}${fmtTerm(C,'')}`;
        return { text: qText, answer: ans, type: '展開' };
      } 
      else {
        const type = Math.random() > 0.5 ? 1 : 2;
        if (type === 1) {
          const a = getRandomNonZero(-4, 4);
          const b = getRandomNonZero(-4, 4);
          const c = getRandomNonZero(-4, 4);
          const qText = `(x ${a>0?'+ '+a:'- '+Math.abs(a)})(x ${b>0?'+ '+b:'- '+Math.abs(b)})(x ${c>0?'+ '+c:'- '+Math.abs(c)})`;
          const c2 = a + b + c;
          const c1 = a*b + b*c + c*a;
          const c0 = a * b * c;
          const ans = `x³${fmtTerm(c2,'x²')}${fmtTerm(c1,'x')}${fmtTerm(c0,'')}`;
          return { text: qText, answer: ans, type: '展開' };
        } else {
          const a = getRandomNonZero(-5, 5);
          const qText = `(x + y ${a>0?'+ '+a:'- '+Math.abs(a)})²`;
          const a2 = a * 2;
          const aSq = a * a;
          const ans = `x²+2xy+y²${fmtTerm(a2,'x')}${fmtTerm(a2,'y')}${fmtTerm(aSq,'')}`;
          return { text: qText, answer: ans, type: '展開' };
        }
      }
    }

    function generateFactorQuestion() {
      if (currentDifficulty === 'easy') {
        const a = getRandomNonZero(-8, 8);
        const b = getRandomNonZero(-8, 8);
        const sum = a + b, prod = a * b;
        const qText = `x²${fmtTerm(sum,'x')}${fmtTerm(prod,'')}`;
        const strA = a > 0 ? `+${a}` : `${a}`;
        const strB = b > 0 ? `+${b}` : `${b}`;
        return {
          text: qText,
          answerValid: [`(x${strA})(x${strB})`, `(x${strB})(x${strA})`],
          answerShow: `(x${strA})(x${strB})`,
          type: '因数分解'
        };
      } 
      else if (currentDifficulty === 'normal') {
        const a = Math.floor(Math.random() * 3) + 2;
        const c = Math.floor(Math.random() * 2) + 1;
        const b = getRandomNonZero(-5, 5);
        const d = getRandomNonZero(-5, 5);

        const A = a * c;
        const B = a * d + b * c;
        const C = b * d;

        const qText = `${fmtTerm(A,'x²',true)}${fmtTerm(B,'x')}${fmtTerm(C,'')}`;
        const term1 = `${fmtTerm(a,'x',true)}${b>0?'+'+b:b}`;
        const term2 = `${fmtTerm(c,'x',true)}${d>0?'+'+d:d}`;

        return {
          text: qText,
          answerValid: [`(${term1})(${term2})`, `(${term2})(${term1})`],
          answerShow: `(${term1})(${term2})`,
          type: '因数分解'
        };
      } 
      else {
        const type = Math.random() > 0.5 ? 1 : 2;
        if (type === 1) {
          const a = getRandomNonZero(-5, 5);
          const b = getRandomNonZero(-5, 5);
          const sum = a + b, prod = a * b;
          const qText = `x⁴${fmtTerm(sum,'x²')}${fmtTerm(prod,'')}`;
          const strA = a > 0 ? `+${a}` : `${a}`;
          const strB = b > 0 ? `+${b}` : `${b}`;
          return {
            text: qText,
            answerValid: [`(x²${strA})(x²${strB})`, `(x²${strB})(x²${strA})`],
            answerShow: `(x²${strA})(x²${strB})`,
            type: '因数分解'
          };
        } else {
          const a = Math.floor(Math.random() * 4) + 2;
          const isPlus = Math.random() > 0.5;
          const qText = isPlus ? `x³ + ${a*a*a}` : `x³ - ${a*a*a}`;
          const aSq = a * a;
          const ansStr = isPlus ? `(x+${a})(x²-${a}x+${aSq})` : `(x-${a})(x²+${a}x+${aSq})`;

          return {
            text: qText,
            answerValid: [ansStr],
            answerShow: ansStr,
            type: '因数分解'
          };
        }
      }
    }

    function showWorksheet() {
      document.getElementById('mode-select').classList.add('hidden');
      document.getElementById('worksheet-screen').classList.remove('hidden');
      generateSheet('mix');
    }

    function generateSheet(type) {
      currentSheetData = [];
      showAnswersFlag = false;
      document.getElementById('toggle-ans-btn').innerText = '答えをすべて表示する';

      for (let i = 0; i < 10; i++) {
        let q;
        if (type === 'expand') q = generateExpandQuestion();
        else if (type === 'factor') q = generateFactorQuestion();
        else q = Math.random() > 0.5 ? generateExpandQuestion() : generateFactorQuestion();
        currentSheetData.push(q);
      }
      renderSheet();
    }

    function renderSheet() {
      const container = document.getElementById('sheet-list');
      container.innerHTML = '';

      currentSheetData.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'print-card bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col gap-2';
        const ansText = item.type === '展開' ? item.answer : item.answerShow;

        card.innerHTML = `
          <div class="flex justify-between items-center text-xs font-semibold text-slate-400">
            <span>問 ${idx + 1} [${item.type}]</span>
          </div>
          <div class="text-lg font-bold text-slate-900 dark:text-indigo-200 py-1">${item.text}</div>
          <div class="sheet-ans text-emerald-600 dark:text-emerald-400 font-mono font-bold text-sm pt-2 border-t border-slate-100 dark:border-slate-800 ${showAnswersFlag ? '' : 'hidden'}">
            答: ${ansText}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleAnswers() {
      showAnswersFlag = !showAnswersFlag;
      document.getElementById('toggle-ans-btn').innerText = showAnswersFlag ? '答えを隠す' : '答えをすべて表示する';
      renderSheet();
    }

    function startGame(mode) {
      currentMode = mode;
      qIndex = 1;
      document.getElementById('mode-select').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('q-num').innerText = qIndex;
      
      const diffNames = { easy: '初級', normal: '中級', hard: '上級' };
      document.getElementById('diff-label').innerText = diffNames[currentDifficulty];
      document.getElementById('mode-label').innerText = mode === 'expand' ? '展開しなさい' : '因数分解しなさい';
      
      startTime = Date.now();
      timerInterval = setInterval(() => {
        document.getElementById('timer').innerText = ((Date.now() - startTime) / 1000).toFixed(1);
      }, 100);

      nextQuestion();
    }

    function nextQuestion() {
      document.getElementById('feedback').innerText = '';
      document.getElementById('answer-input').value = '';
      document.getElementById('answer-input').focus();
      currentQuestionData = currentMode === 'expand' ? generateExpandQuestion() : generateFactorQuestion();
      document.getElementById('question').innerText = currentQuestionData.text;
    }

    /* 入力の表記ゆれ吸収関数 */
    function normalize(str) { 
      return str
        .replace(/\s+/g, '')
        .toLowerCase()
        .replace(/\^2/g, '²')
        .replace(/\^3/g, '³')
        .replace(/\^4/g, '⁴')
        .replace(/x2/g, 'x²')
        .replace(/y2/g, 'y²')
        .replace(/x3/g, 'x³')
        .replace(/x4/g, 'x⁴');
    }

    function checkAnswer() {
      const userAns = normalize(document.getElementById('answer-input').value);
      if (!userAns) return;

      let isCorrect = currentQuestionData.type === '展開' 
        ? (userAns === normalize(currentQuestionData.answer))
        : currentQuestionData.answerValid.some(ans => userAns === normalize(ans));

      const feedbackEl = document.getElementById('feedback');
      if (isCorrect) {
        feedbackEl.className = 'text-center font-bold h-6 text-sm text-emerald-500';
        feedbackEl.innerText = '⭕ 正解！';
        setTimeout(() => {
          if (qIndex < 10) {
            qIndex++;
            document.getElementById('q-num').innerText = qIndex;
            nextQuestion();
          } else {
            finishGame();
          }
        }, 500);
      } else {
        feedbackEl.className = 'text-center font-bold h-6 text-sm text-rose-500';
        const correctShow = currentQuestionData.type === '展開' ? currentQuestionData.answer : currentQuestionData.answerShow;
        feedbackEl.innerText = `❌ 不正解！ 正解: ${correctShow}`;
      }
    }

    function finishGame() {
      clearInterval(timerInterval);
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      saveRecord(elapsed);
      alert(`🎉 10問クリア！ タイム: ${elapsed}秒`);
      showHome();
    }

    function saveRecord(time) {
      let records = JSON.parse(localStorage.getItem('math_records') || '[]');
      records.push(parseFloat(time));
      localStorage.setItem('math_records', JSON.stringify(records));
    }

    function showDashboard() {
      document.getElementById('mode-select').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      let records = JSON.parse(localStorage.getItem('math_records') || '[]');
      document.getElementById('total-plays').innerText = `${records.length} 回`;
      if (records.length > 0) {
        document.getElementById('best-time').innerText = `${Math.min(...records).toFixed(1)} 秒`;
        document.getElementById('avg-time').innerText = `${(records.reduce((a, b) => a + b, 0) / records.length).toFixed(1)} 秒`;
      }
    }

    function showHome() {
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('worksheet-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.add('hidden');
      document.getElementById('mode-select').classList.remove('hidden');
    }
  </script>
</body>
</html>
