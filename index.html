<!DOCTYPE html>
<html lang="ja" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>展開・因数分解 | Math Speed Training</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Math Speed">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['"SF Mono"', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body { user-select: none; -webkit-user-select: none; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
      .print-card { border: 1px solid #e2e8f0 !important; background: white !important; color: black !important; }
    }
    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
    .animate-pop {
      animation: popIn 0.5s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <header class="no-print bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
    <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="confirmQuit()">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-indigo-500/20">
          ∑
        </div>
        <span class="font-bold text-lg tracking-tight text-slate-900 dark:text-white">Math Speed</span>
      </div>
      
      <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95">
        <span id="theme-icon" class="text-xl leading-none">🌙</span>
      </button>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center p-4 max-w-xl mx-auto w-full relative">
    
    <div id="result-overlay" class="fixed top-1/2 left-1/2 pointer-events-none z-50 text-8xl font-black hidden"></div>

    <div id="mode-select" class="w-full space-y-5">
      
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">展開・因数分解</h1>
        <p class="text-xs font-medium text-slate-500 dark:text-slate-400">難易度を選んでトレーニングを開始してください</p>
      </div>
      
      <div class="bg-slate-200/70 dark:bg-slate-800/60 p-1.5 rounded-2xl flex gap-1.5 border border-slate-300/40 dark:border-slate-700/40">
        <button id="diff-easy" onclick="setDifficulty('easy')" class="flex-1 py-2.5 rounded-xl font-bold text-xs transition-all">初級</button>
        <button id="diff-normal" onclick="setDifficulty('normal')" class="flex-1 py-2.5 rounded-xl font-bold text-xs transition-all">中級</button>
        <button id="diff-hard" onclick="setDifficulty('hard')" class="flex-1 py-2.5 rounded-xl font-bold text-xs transition-all">上級 (1対1・共テ)</button>
      </div>

      <div class="space-y-2.5">
        <button onclick="startGame('expand')" class="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-bold text-base shadow-lg shadow-indigo-500/25 border-b-4 border-indigo-800 transition active:border-b-0 active:translate-y-1 flex items-center justify-between">
          <span>⚡ 展開スピードトレ</span>
          <span class="text-xs font-normal opacity-80">10問計測</span>
        </button>
        <button onclick="startGame('factor')" class="w-full py-4 px-6 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-bold text-base shadow-lg shadow-emerald-500/25 border-b-4 border-emerald-800 transition active:border-b-0 active:translate-y-1 flex items-center justify-between">
          <span>⚡ 因数分解スピードトレ</span>
          <span class="text-xs font-normal opacity-80">10問計測</span>
        </button>
        <button id="retry-btn" onclick="startRetryMode()" class="w-full py-3.5 px-6 bg-rose-600 hover:bg-rose-500 text-white rounded-2xl font-bold text-sm shadow-lg shadow-rose-500/20 border-b-4 border-rose-800 transition active:border-b-0 active:translate-y-1 flex items-center justify-between">
          <span>🔥 ミス問題の復習</span>
          <span id="mistake-count" class="text-xs font-bold bg-white/20 px-2 py-0.5 rounded-full">0問</span>
        </button>
      </div>

      <div class="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-2.5">
        <button onclick="showWorksheet()" class="w-full py-3.5 px-6 bg-amber-500/10 hover:bg-amber-500/20 text-amber-600 dark:text-amber-400 border border-amber-500/30 rounded-2xl font-bold text-sm transition flex items-center justify-center gap-2">
          <span>📝 問題集モード（一括表示・印刷）</span>
        </button>
        <button onclick="showDashboard()" class="w-full py-3.5 px-6 bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-2xl font-bold text-sm transition flex items-center justify-center gap-2">
          <span>📊 成績ダッシュボード</span>
        </button>
      </div>
    </div>

    <div id="game-screen" class="w-full hidden space-y-4">
      <div class="flex justify-between items-center text-xs font-semibold text-slate-500 dark:text-slate-400">
        <button onclick="confirmQuit()" class="flex items-center gap-1 text-slate-400 hover:text-rose-500 transition font-bold py-1 px-2 rounded-lg hover:bg-rose-500/10">
          ✕ 退出
        </button>
        <span class="bg-amber-500/10 text-amber-600 dark:text-amber-400 px-2.5 py-1 rounded-full border border-amber-500/20">
          <span id="diff-label" class="font-bold">中級</span>
        </span>
        <span class="text-slate-700 dark:text-slate-300">問題 <span id="q-num" class="text-indigo-600 dark:text-indigo-400 font-bold text-sm">1</span> / <span id="q-total">10</span></span>
        <span class="font-mono text-sm bg-slate-200 dark:bg-slate-800 px-3 py-1 rounded-full text-slate-800 dark:text-slate-200"><span id="timer">0.0</span>s</span>
      </div>

      <div id="card" class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-none text-center space-y-2">
        <div class="text-xs font-bold text-slate-400 uppercase tracking-wider" id="mode-label">展開しなさい</div>
        <div id="question" class="text-xl font-black tracking-wide text-slate-900 dark:text-white py-1 leading-relaxed">--</div>
      </div>

      <div class="space-y-2.5">
        <input type="text" id="answer-input" placeholder="答えを入力" class="w-full py-3 px-4 bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-2xl text-center text-lg font-mono text-slate-900 dark:text-white focus:outline-none focus:border-indigo-600 dark:focus:border-indigo-500 shadow-sm transition" autocomplete="off">
        
        <div class="grid grid-cols-6 gap-1.5 pt-1">
          <button onclick="appendKey('a')" class="py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">a</button>
          <button onclick="appendKey('b')" class="py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">b</button>
          <button onclick="appendKey('c')" class="py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">c</button>
          <button onclick="appendKey('x')" class="py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">x</button>
          <button onclick="appendKey('y')" class="py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">y</button>
          <button onclick="appendKey('z')" class="py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">z</button>

          <button onclick="appendKey('²')" class="py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">²</button>
          <button onclick="appendKey('³')" class="py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">³</button>
          <button onclick="appendKey('⁴')" class="py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">⁴</button>
          <button onclick="appendKey('+')" class="py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">+</button>
          <button onclick="appendKey('-')" class="py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">-</button>
          <button onclick="backspaceKey()" class="py-2 bg-rose-500/10 text-rose-600 dark:text-rose-400 font-bold rounded-xl text-xs transition active:scale-95">⌫</button>

          <button onclick="appendKey('(')" class="col-span-3 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">(</button>
          <button onclick="appendKey(')')" class="col-span-3 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold rounded-xl text-sm transition active:scale-95">)</button>
        </div>

        <button onclick="checkAnswer()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-bold text-base shadow-lg shadow-indigo-500/25 border-b-4 border-indigo-800 transition active:border-b-0 active:translate-y-1">
          回答する (Enter)
        </button>
      </div>

      <div id="feedback" class="text-center font-bold h-6 text-sm"></div>
    </div>

    <div id="worksheet-screen" class="w-full hidden space-y-6">
      <div class="no-print flex flex-col gap-4">
        <div class="flex items-center justify-between">
          <button onclick="showHome()" class="text-xs font-bold text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition py-1 px-2.5 bg-slate-100 dark:bg-slate-800 rounded-lg">
            ← ホームへ
          </button>
          <div class="text-center">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">📝 問題集モード</h2>
          </div>
          <div class="w-16"></div>
        </div>
        
        <div class="flex gap-2">
          <button onclick="generateSheet('expand')" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-xs shadow-sm">展開 10問</button>
          <button onclick="generateSheet('factor')" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-xs shadow-sm">因数分解 10問</button>
          <button onclick="generateSheet('mix')" class="flex-1 py-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-bold text-xs shadow-sm">ミックス 10問</button>
        </div>
      </div>

      <div id="sheet-list" class="space-y-3"></div>

      <div class="no-print space-y-3 pt-4 border-t border-slate-200 dark:border-slate-800">
        <button onclick="toggleAnswers()" id="toggle-ans-btn" class="w-full py-3.5 bg-amber-500 text-white rounded-2xl font-bold text-sm shadow-md transition">
          答えをすべて表示する
        </button>
        <button onclick="window.print()" class="w-full py-3.5 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-2xl font-bold text-sm transition">
          🖨️ 印刷する（紙に出力）
        </button>
        <button onclick="showHome()" class="w-full py-3.5 bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 rounded-2xl font-bold text-sm transition">
          ホームに戻る
        </button>
      </div>
    </div>

    <div id="dashboard-screen" class="w-full hidden space-y-6">
      <div class="text-center">
        <h2 class="text-xl font-bold text-slate-900 dark:text-white">📊 成績ダッシュボード</h2>
        <p class="text-xs text-slate-500">これまでのトレーニング記録</p>
      </div>

      <div id="stats" class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-lg shadow-slate-200/50 dark:shadow-none space-y-4">
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3">
          <span class="text-xs font-semibold text-slate-500">解いた問題の総数</span>
          <span id="total-questions" class="font-bold text-indigo-600 dark:text-indigo-400 text-lg">0 問</span>
        </div>
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3">
          <span class="text-xs font-semibold text-slate-500">総クリア回数</span>
          <span id="total-plays" class="font-bold text-slate-900 dark:text-white text-base">0 回</span>
        </div>
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3">
          <span class="text-xs font-semibold text-slate-500">ベストタイム</span>
          <span id="best-time" class="font-black text-emerald-600 dark:text-emerald-400 text-lg">-- 秒</span>
        </div>
        <div class="flex justify-between items-center pb-1">
          <span class="text-xs font-semibold text-slate-500">平均クリアタイム</span>
          <span id="avg-time" class="font-bold text-indigo-600 dark:text-indigo-400 text-base">0.0 秒</span>
        </div>
      </div>

      <button onclick="showHome()" class="w-full py-3.5 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-2xl font-bold text-sm transition">
        ホームに戻る
      </button>
    </div>

  </main>

  <script>
    let currentMode = '';
    let currentDifficulty = 'normal';
    let qIndex = 0;
    let totalQuestionsInGame = 10;
    let startTime = 0;
    let timerInterval = null;
    let currentQuestionData = null;
    let retryQuestions = [];
    let isRetryMode = false;
    let currentSheetData = [];
    let showAnswersFlag = false;
    let recentQuestions = [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(110, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    function triggerVisualFeedback(isCorrect) {
      const overlay = document.getElementById('result-overlay');
      overlay.innerText = isCorrect ? '⭕' : '❌';
      overlay.className = `fixed top-1/2 left-1/2 pointer-events-none z-50 text-8xl font-black animate-pop ${isCorrect ? 'text-emerald-500' : 'text-rose-500'}`;
      overlay.classList.remove('hidden');

      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 450);
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('math_theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').innerText = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').innerText = '🌙';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('math_theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
    }

    initTheme();

    document.getElementById('answer-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') checkAnswer();
    });

    function appendKey(char) {
      const input = document.getElementById('answer-input');
      input.value += char;
      input.focus();
    }

    function backspaceKey() {
      const input = document.getElementById('answer-input');
      input.value = input.value.slice(0, -1);
      input.focus();
    }

    function updateMistakeBadge() {
      const mistakes = JSON.parse(localStorage.getItem('math_mistakes') || '[]');
      document.getElementById('mistake-count').innerText = `${mistakes.length}問`;
      const retryBtn = document.getElementById('retry-btn');
      if (mistakes.length === 0) {
        retryBtn.classList.add('opacity-50', 'pointer-events-none');
      } else {
        retryBtn.classList.remove('opacity-50', 'pointer-events-none');
      }
    }

    function setDifficulty(diff) {
      currentDifficulty = diff;
      const btnE = document.getElementById('diff-easy');
      const btnN = document.getElementById('diff-normal');
      const btnH = document.getElementById('diff-hard');

      const activeClass = 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm font-black';
      const inactiveClass = 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-semibold';

      btnE.className = `flex-1 py-2.5 rounded-xl font-bold text-xs transition-all ${diff === 'easy' ? activeClass : inactiveClass}`;
      btnN.className = `flex-1 py-2.5 rounded-xl font-bold text-xs transition-all ${diff === 'normal' ? activeClass : inactiveClass}`;
      btnH.className = `flex-1 py-2.5 rounded-xl font-bold text-xs transition-all ${diff === 'hard' ? activeClass : inactiveClass}`;
    }

    setDifficulty('normal');

    function getRandomNonZero(min, max) {
      let n = 0;
      while (n === 0) n = Math.floor(Math.random() * (max - min + 1)) + min;
      return n;
    }

    function fmtTerm(coeff, varStr, isFirst = false) {
      if (coeff === 0) return '';
      let sign = coeff > 0 ? (isFirst ? '' : '+') : '-';
      let abs = Math.abs(coeff);
      let numStr = (abs === 1 && varStr !== '') ? '' : abs;
      return `${sign}${numStr}${varStr}`;
    }

    function generateUniqueExpandQuestion() {
      let q;
      let maxTry = 10;
      while (maxTry-- > 0) {
        q = makeExpandData();
        if (!recentQuestions.includes(q.text)) break;
      }
      recentQuestions.push(q.text);
      if (recentQuestions.length > 15) recentQuestions.shift();
      return q;
    }

    function makeExpandData() {
      if (currentDifficulty === 'easy') {
        const type = Math.floor(Math.random() * 3);
        if (type === 0) {
          const a = getRandomNonZero(-9, 9);
          const b = getRandomNonZero(-9, 9);
          const qText = `(x ${a>0?'+ '+a:'- '+Math.abs(a)})(x ${b>0?'+ '+b:'- '+Math.abs(b)})`;
          const ans = `x²${fmtTerm(a+b, 'x')}${fmtTerm(a*b, '')}`;
          return { text: qText, answer: ans, type: '展開' };
        } else if (type === 1) {
          const a = getRandomNonZero(-9, 9);
          const qText = `(x ${a>0?'+ '+a:'- '+Math.abs(a)})²`;
          const ans = `x²${fmtTerm(2*a, 'x')}${fmtTerm(a*a, '')}`;
          return { text: qText, answer: ans, type: '展開' };
        } else {
          const a = Math.floor(Math.random() * 9) + 1;
          const qText = `(x + ${a})(x - ${a})`;
          const ans = `x²${fmtTerm(-a*a, '')}`;
          return { text: qText, answer: ans, type: '展開' };
        }
      } 
      else if (currentDifficulty === 'normal') {
        const type = Math.floor(Math.random() * 3);
        if (type === 0) {
          const a = Math.floor(Math.random() * 4) + 2;
          const c = Math.floor(Math.random() * 3) + 1;
          const b = getRandomNonZero(-6, 6);
          const d = getRandomNonZero(-6, 6);
          const qText = `(${fmtTerm(a,'x',true)} ${b>0?'+ '+b:'- '+Math.abs(b)})(${fmtTerm(c,'x',true)} ${d>0?'+ '+d:'- '+Math.abs(d)})`;
          const ans = `${fmtTerm(a*c,'x²',true)}${fmtTerm(a*d+b*c,'x')}${fmtTerm(b*d,'')}`;
          return { text: qText, answer: ans, type: '展開' };
        } else if (type === 1) {
          const a = Math.floor(Math.random() * 3) + 2;
          const b = getRandomNonZero(-5, 5);
          const qText = `(${fmtTerm(a,'x',true)} ${b>0?'+ '+b:'- '+Math.abs(b)})²`;
          const ans = `${fmtTerm(a*a,'x²',true)}${fmtTerm(2*a*b,'x')}${fmtTerm(b*b,'')}`;
          return { text: qText, answer: ans, type: '展開' };
        } else {
          const a = getRandomNonZero(-5, 5);
          const b = getRandomNonZero(-5, 5);
          const qText = `(x ${a>0?'+ '+a:'- '+Math.abs(a)}y)(x ${b>0?'+ '+b:'- '+Math.abs(b)}y)`;
          const ans = `x²${fmtTerm(a+b, 'xy')}${fmtTerm(a*b, 'y²')}`;
          return { text: qText, answer: ans, type: '展開' };
        }
      } 
      else {
        // 上級 (1対1・共通テストレベル)
        const type = Math.floor(Math.random() * 4);
        if (type === 0) { // (x+a)(x+b)(x+c)(x+d) の組替え展開
          const a = 1, b = 2, c = 3, d = 4; // (x+1)(x+4)(x+2)(x+3) -> (x²+5x+4)(x²+5x+6)
          const qText = `(x + 1)(x + 2)(x + 3)(x + 4)`;
          const ans = `x⁴+10x³+35x²+50x+24`;
          return { text: qText, answer: ans, type: '展開' };
        } else if (type === 1) { // 3変数対称式の展開 (a+b+c)(ab+bc+ca)
          const qText = `(a + b + c)(ab + bc + ca)`;
          const ans = `a²b+ab²+b²c+bc²+c²a+ca²+3abc`;
          return { text: qText, answer: ans, type: '展開' };
        } else if (type === 2) { // 3項2乗展開 (x + y + z)²
          const k = getRandomNonZero(-3, 3);
          const qText = `(x + y ${k>0?'+ '+k:'- '+Math.abs(k)})²`;
          const ans = `x²+2xy+y²${fmtTerm(2*k,'x')}${fmtTerm(2*k,'y')}${fmtTerm(k*k,'')}`;
          return { text: qText, answer: ans, type: '展開' };
        } else { // (a + b)³ の展開
          const a = Math.floor(Math.random() * 2) + 2;
          const qText = `(${a}x + 1)³`;
          const a3 = a*a*a, a23 = 3*a*a, a3_ = 3*a;
          const ans = `${a3}x³+${a23}x²+${a3_}x+1`;
          return { text: qText, answer: ans, type: '展開' };
        }
      }
    }

    function generateUniqueFactorQuestion() {
      let q;
      let maxTry = 10;
      while (maxTry-- > 0) {
        q = makeFactorData();
        if (!recentQuestions.includes(q.text)) break;
      }
      recentQuestions.push(q.text);
      if (recentQuestions.length > 15) recentQuestions.shift();
      return q;
    }

    function makeFactorData() {
      if (currentDifficulty === 'easy') {
        const type = Math.floor(Math.random() * 3);
        if (type === 0) {
          const a = getRandomNonZero(-8, 8);
          const b = getRandomNonZero(-8, 8);
          const qText = `x²${fmtTerm(a+b,'x')}${fmtTerm(a*b,'')}`;
          const strA = a > 0 ? `+${a}` : `${a}`;
          const strB = b > 0 ? `+${b}` : `${b}`;
          return { text: qText, answerValid: [`(x${strA})(x${strB})`, `(x${strB})(x${strA})`], answerShow: `(x${strA})(x${strB})`, type: '因数分解' };
        } else if (type === 1) {
          const a = Math.floor(Math.random() * 8) + 2;
          const qText = `x² - ${a*a}`;
          return { text: qText, answerValid: [`(x+${a})(x-${a})`, `(x-${a})(x+${a})`], answerShow: `(x+${a})(x-${a})`, type: '因数分解' };
        } else {
          const a = getRandomNonZero(-7, 7);
          const qText = `x²${fmtTerm(2*a,'x')}${fmtTerm(a*a,'')}`;
          const strA = a > 0 ? `+${a}` : `${a}`;
          return { text: qText, answerValid: [`(x${strA})²`], answerShow: `(x${strA})²`, type: '因数分解' };
        }
      } 
      else if (currentDifficulty === 'normal') {
        const type = Math.floor(Math.random() * 3);
        if (type === 0) {
          const a = Math.floor(Math.random() * 3) + 2;
          const c = Math.floor(Math.random() * 2) + 1;
          const b = getRandomNonZero(-5, 5);
          const d = getRandomNonZero(-5, 5);
          const qText = `${fmtTerm(a*c,'x²',true)}${fmtTerm(a*d+b*c,'x')}${fmtTerm(b*d,'')}`;
          const t1 = `${fmtTerm(a,'x',true)}${b>0?'+'+b:b}`;
          const t2 = `${fmtTerm(c,'x',true)}${d>0?'+'+d:d}`;
          return { text: qText, answerValid: [`(${t1})(${t2})`, `(${t2})(${t1})`], answerShow: `(${t1})(${t2})`, type: '因数分解' };
        } else if (type === 1) {
          const m = Math.floor(Math.random() * 4) + 2;
          const a = getRandomNonZero(-5, 5);
          const b = getRandomNonZero(-5, 5);
          const qText = `${m}x²${fmtTerm(m*(a+b),'x')}${fmtTerm(m*a*b,'')}`;
          const strA = a > 0 ? `+${a}` : `${a}`;
          const strB = b > 0 ? `+${b}` : `${b}`;
          return { text: qText, answerValid: [`${m}(x${strA})(x${strB})`, `${m}(x${strB})(x${strA})`], answerShow: `${m}(x${strA})(x${strB})`, type: '因数分解' };
        } else {
          const a = getRandomNonZero(-5, 5);
          const b = getRandomNonZero(-5, 5);
          const qText = `x²${fmtTerm(a+b,'xy')}${fmtTerm(a*b,'y²')}`;
          const strA = a > 0 ? `+${a}` : `${a}`;
          const strB = b > 0 ? `+${b}` : `${b}`;
          return { text: qText, answerValid: [`(x${strA}y)(x${strB}y)`, `(x${strB}y)(x${strA}y)`], answerShow: `(x${strA}y)(x${strB}y)`, type: '因数分解' };
        }
      } 
      else {
        // 上級 (1対1・思考力レベル)
        const type = Math.floor(Math.random() * 4);
        if (type === 0) { // 共通部分置き換え (x²-2x)² - 11(x²-2x) + 24 
          const qText = `(x² - 2x)² - 11(x² - 2x) + 24`;
          return { 
            text: qText, 
            answerValid: [
              `(x-3)(x+1)(x-4)(x+2)`, `(x+1)(x-3)(x-4)(x+2)`, `(x-4)(x+2)(x-3)(x+1)`
            ], 
            answerShow: `(x-3)(x+1)(x-4)(x+2)`, 
            type: '因数分解' 
          };
        } else if (type === 1) { // 複二次式（足して引いて平方の差を作る） x⁴ + 4y⁴
          const qText = `x⁴ + 4y⁴`;
          return { 
            text: qText, 
            answerValid: [
              `(x²+2xy+2y²)(x²-2xy+2y²)`, `(x²-2xy+2y²)(x²+2xy+2y²)`
            ], 
            answerShow: `(x²+2xy+2y²)(x²-2xy+2y²)`, 
            type: '因数分解' 
          };
        } else if (type === 2) { // 2変数・最低次で整理 2x² + 5xy + 2y² + 4x + 5y + 2
          const qText = `2x² + 5xy + 2y² + 4x + 5y + 2`;
          return { 
            text: qText, 
            answerValid: [
              `(x+2y+1)(2x+y+2)`, `(2x+y+2)(x+2y+1)`
            ], 
            answerShow: `(x+2y+1)(2x+y+2)`, 
            type: '因数分解' 
          };
        } else { // 交代式 a(b²-c²) + b(c²-a²) + c(a²-b²)
          const qText = `a(b² - c²) + b(c² - a²) + c(a² - b²)`;
          return { 
            text: qText, 
            answerValid: [
              `-(a-b)(b-c)(c-a)`, `(a-b)(b-c)(a-c)`, `(b-a)(c-b)(a-c)`
            ], 
            answerShow: `(a-b)(b-c)(a-c)`, 
            type: '因数分解' 
          };
        }
      }
    }

    function startGame(mode) {
      isRetryMode = false;
      currentMode = mode;
      qIndex = 1;
      totalQuestionsInGame = 10;
      setupGameUI();
      nextQuestion();
    }

    function startRetryMode() {
      const mistakes = JSON.parse(localStorage.getItem('math_mistakes') || '[]');
      if (mistakes.length === 0) return;

      isRetryMode = true;
      retryQuestions = mistakes;
      qIndex = 1;
      totalQuestionsInGame = retryQuestions.length;
      setupGameUI('復習');
      nextQuestion();
    }

    function setupGameUI(diffOverride) {
      document.getElementById('mode-select').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('q-num').innerText = qIndex;
      document.getElementById('q-total').innerText = totalQuestionsInGame;
      
      const diffNames = { easy: '初級', normal: '中級', hard: '上級 (1対1・共テ)' };
      document.getElementById('diff-label').innerText = diffOverride || diffNames[currentDifficulty];
      
      startTime = Date.now();
      timerInterval = setInterval(() => {
        document.getElementById('timer').innerText = ((Date.now() - startTime) / 1000).toFixed(1);
      }, 100);
    }

    function nextQuestion() {
      document.getElementById('feedback').innerText = '';
      document.getElementById('answer-input').value = '';
      document.getElementById('answer-input').focus();

      if (isRetryMode) {
        currentQuestionData = retryQuestions[qIndex - 1];
        document.getElementById('mode-label').innerText = currentQuestionData.type === '展開' ? '展開しなさい' : '因数分解しなさい';
      } else {
        currentQuestionData = currentMode === 'expand' ? generateUniqueExpandQuestion() : generateUniqueFactorQuestion();
        document.getElementById('mode-label').innerText = currentMode === 'expand' ? '展開しなさい' : '因数分解しなさい';
      }
      document.getElementById('question').innerText = currentQuestionData.text;
    }

    function normalize(str) { 
      return str
        .replace(/\s+/g, '')
        .toLowerCase()
        .replace(/\^2/g, '²')
        .replace(/\^3/g, '³')
        .replace(/\^4/g, '⁴')
        .replace(/a2/g, 'a²').replace(/b2/g, 'b²').replace(/c2/g, 'c²')
        .replace(/x2/g, 'x²').replace(/y2/g, 'y²').replace(/z2/g, 'z²')
        .replace(/x3/g, 'x³').replace(/x4/g, 'x⁴');
    }

    function parseTerms(str) {
      let norm = normalize(str);
      if (norm[0] !== '+' && norm[0] !== '-') norm = '+' + norm;
      const terms = norm.match(/[+-][^+-]+/g) || [];
      return terms.map(t => {
        return t.replace(/\+1(?=[a-z²³⁴])/, '+').replace(/\-1(?=[a-z²³⁴])/, '-');
      }).sort();
    }

    function comparePolynomials(user, target) {
      const uTerms = parseTerms(user);
      const tTerms = parseTerms(target);
      if (uTerms.length !== tTerms.length) return false;
      return uTerms.every((term, idx) => term === tTerms[idx]);
    }

    function checkAnswer() {
      const inputEl = document.getElementById('answer-input');
      const userRaw = inputEl.value;
      if (!userRaw.trim()) return;

      incrementTotalQuestions();

      let isCorrect = false;

      if (currentQuestionData.type === '展開') {
        isCorrect = comparePolynomials(userRaw, currentQuestionData.answer);
      } else {
        const normUser = normalize(userRaw);
        isCorrect = currentQuestionData.answerValid.some(ans => normUser === normalize(ans));
      }

      playSound(isCorrect ? 'correct' : 'wrong');
      triggerVisualFeedback(isCorrect);

      if (isCorrect) {
        if (isRetryMode) {
          removeMistake(currentQuestionData);
        }

        setTimeout(() => {
          if (qIndex < totalQuestionsInGame) {
            qIndex++;
            document.getElementById('q-num').innerText = qIndex;
            nextQuestion();
          } else {
            finishGame();
          }
        }, 350);
      } else {
        if (!isRetryMode) {
          saveMistake(currentQuestionData);
        }
        inputEl.value = '';
        inputEl.focus();
      }
    }

    function saveMistake(qData) {
      let mistakes = JSON.parse(localStorage.getItem('math_mistakes') || '[]');
      if (!mistakes.some(m => m.text === qData.text)) {
        mistakes.push(qData);
        localStorage.setItem('math_mistakes', JSON.stringify(mistakes));
      }
    }

    function removeMistake(qData) {
      let mistakes = JSON.parse(localStorage.getItem('math_mistakes') || '[]');
      mistakes = mistakes.filter(m => m.text !== qData.text);
      localStorage.setItem('math_mistakes', JSON.stringify(mistakes));
    }

    function incrementTotalQuestions() {
      let count = parseInt(localStorage.getItem('math_total_q') || '0', 10);
      localStorage.setItem('math_total_q', (count + 1).toString());
    }

    function finishGame() {
      clearInterval(timerInterval);
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      
      if (!isRetryMode) {
        saveRecord(elapsed);
        alert(`🎉 クリア！ タイム: ${elapsed}秒`);
      } else {
        alert(`🎉 復習完了！ ミス問題を克服しました！`);
      }
      showHome();
    }

    function saveRecord(time) {
      let records = JSON.parse(localStorage.getItem('math_records') || '[]');
      records.push(parseFloat(time));
      localStorage.setItem('math_records', JSON.stringify(records));
    }

    function showWorksheet() {
      document.getElementById('mode-select').classList.add('hidden');
      document.getElementById('worksheet-screen').classList.remove('hidden');
      generateSheet('mix');
    }

    function generateSheet(type) {
      currentSheetData = [];
      showAnswersFlag = false;
      document.getElementById('toggle-ans-btn').innerText = '答えをすべて表示する';

      for (let i = 0; i < 10; i++) {
        let q;
        if (type === 'expand') q = generateUniqueExpandQuestion();
        else if (type === 'factor') q = generateUniqueFactorQuestion();
        else q = Math.random() > 0.5 ? generateUniqueExpandQuestion() : generateUniqueFactorQuestion();
        currentSheetData.push(q);
      }
      renderSheet();
    }

    function renderSheet() {
      const container = document.getElementById('sheet-list');
      container.innerHTML = '';

      currentSheetData.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'print-card bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col gap-2';
        const ansText = item.type === '展開' ? item.answer : item.answerShow;

        card.innerHTML = `
          <div class="flex justify-between items-center text-xs font-semibold text-slate-400">
            <span>問 ${idx + 1} [${item.type}]</span>
          </div>
          <div class="text-lg font-bold text-slate-900 dark:text-indigo-200 py-1">${item.text}</div>
          <div class="sheet-ans text-emerald-600 dark:text-emerald-400 font-mono font-bold text-sm pt-2 border-t border-slate-100 dark:border-slate-800 ${showAnswersFlag ? '' : 'hidden'}">
            答: ${ansText}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleAnswers() {
      showAnswersFlag = !showAnswersFlag;
      document.getElementById('toggle-ans-btn').innerText = showAnswersFlag ? '答えを隠す' : '答えをすべて表示する';
      renderSheet();
    }

    function showDashboard() {
      document.getElementById('mode-select').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      
      let totalQ = localStorage.getItem('math_total_q') || '0';
      document.getElementById('total-questions').innerText = `${totalQ} 問`;

      let records = JSON.parse(localStorage.getItem('math_records') || '[]');
      document.getElementById('total-plays').innerText = `${records.length} 回`;
      if (records.length > 0) {
        document.getElementById('best-time').innerText = `${Math.min(...records).toFixed(1)} 秒`;
        document.getElementById('avg-time').innerText = `${(records.reduce((a, b) => a + b, 0) / records.length).toFixed(1)} 秒`;
      }
    }

    function confirmQuit() {
      const gameScreen = document.getElementById('game-screen');
      if (!gameScreen.classList.contains('hidden')) {
        if (confirm('途中退出しますか？（現在のタイムは記録されません）')) {
          showHome();
        }
      } else {
        showHome();
      }
    }

    function showHome() {
      if (timerInterval) clearInterval(timerInterval);
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('worksheet-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.add('hidden');
      document.getElementById('mode-select').classList.remove('hidden');
      updateMistakeBadge();
    }

    updateMistakeBadge();
  </script>
</body>
