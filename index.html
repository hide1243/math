<!DOCTYPE html>
<html lang="ja" class="light">
<head>

  <title>展開・因数分解 | Math Speed Training</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" id="dynamic-favicon" type="image/png">
  <link rel="apple-touch-icon" id="apple-icon">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Math Speed">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['"SF Mono"', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
      .print-card { border: 1px solid #e2e8f0 !important; background: white !important; color: black !important; }
    }
    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
    .animate-pop {
      animation: popIn 0.5s ease-out forwards;
    }
    input[type="text"] {
      font-size: 18px !important;
    }
  </style>

  <script>
    (function() {
      function createIcon() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 512, 512);
        grad.addColorStop(0, '#4f46e5');
        grad.addColorStop(1, '#9333ea');
        ctx.fillStyle = grad;
        
        const radius = 110;
        ctx.beginPath();
        ctx.moveTo(radius, 0);
        ctx.lineTo(512 - radius, 0);
        ctx.quadraticCurveTo(512, 0, 512, radius);
        ctx.lineTo(512, 512 - radius);
        ctx.quadraticCurveTo(512, 512, 512 - radius, 512);
        ctx.lineTo(radius, 512);
        ctx.quadraticCurveTo(0, 512, 0, 512 - radius);
        ctx.lineTo(0, radius);
        ctx.quadraticCurveTo(0, 0, radius, 0);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 240px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 20;
        ctx.fillText('Σ', 230, 260);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f59e0b';
        ctx.font = '900 130px sans-serif';
        ctx.fillText('⚡', 360, 210);

        const iconUrl = canvas.toDataURL('image/png');
        
        const fav = document.getElementById('dynamic-favicon');
        const app = document.getElementById('apple-icon');
        if (fav) fav.href = iconUrl;
        if (app) app.href = iconUrl;
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', createIcon);
      } else {
        createIcon();
      }
    })();
  </script>
</head>

  <script>
    let currentMode = '';
    let currentDifficulty = 'normal';
    let inputStyle = 'choice'; // 'choice' または 'keyboard'
    let qIndex = 0;
    let totalQuestionsInGame = 10;
    let startTime = 0;
    let timerInterval = null;
    let currentQuestionData = null;
    let currentChoices = [];
    let retryQuestions = [];
    let isRetryMode = false;
    let currentSheetData = [];
    let showAnswersFlag = false;
    let recentQuestions = [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(110, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    function triggerVisualFeedback(isCorrect) {
      const overlay = document.getElementById('result-overlay');
      overlay.innerText = isCorrect ? '⭕' : '❌';
      overlay.className = `fixed top-1/2 left-1/2 pointer-events-none z-50 text-8xl font-black animate-pop ${isCorrect ? 'text-emerald-500' : 'text-rose-500'}`;
      overlay.classList.remove('hidden');

      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 450);
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('math_theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').innerText = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').innerText = '🌙';
      }
    }

    function toggleTheme() {

    function getRandomNonZero(min, max) {
      let n = 0;
      while (n === 0) n = Math.floor(Math.random() * (max - min + 1)) + min;
      return n;
    }

    function fmtTerm(coeff, varStr, isFirst = false) {
      if (coeff === 0) return '';
      let sign = coeff > 0 ? (isFirst ? '' : '+') : '-';
      let abs = Math.abs(coeff);
      let numStr = (abs === 1 && varStr !== '') ? '' : abs;
      return `${sign}${numStr}${varStr}`;
    }

    function generateUniqueExpandQuestion() {
      let q;
      let maxTry = 10;
      while (maxTry-- > 0) {
        q = makeExpandData();
        if (!recentQuestions.includes(q.text)) break;
      }
      recentQuestions.push(q.text);
      if (recentQuestions.length > 15) recentQuestions.shift();
      return q;
    }

    function makeExpandData() {
      if (currentDifficulty === 'easy') {
        const type = Math.floor(Math.random() * 3);
        if (type === 0) {
          const a = getRandomNonZero(-9, 9);
          const b = getRandomNonZero(-9, 9);
          const qText = `(x ${a>0?'+ '+a:'- '+Math.abs(a)})(x ${b>0?'+ '+b:'- '+Math.abs(b)})`;
          const ans = `x²${fmtTerm(a+b, 'x')}${fmtTerm(a*b, '')}`;
          const dummy1 = `x²${fmtTerm(a-b, 'x')}${fmtTerm(a*b, '')}`;
          const dummy2 = `x²${fmtTerm(a+b, 'x')}${fmtTerm(-a*b, '')}`;
          const dummy3 = `x²${fmtTerm(a*b, 'x')}${fmtTerm(a+b, '')}`;
          return { text: qText, answer: ans, dummies: [dummy1, dummy2, dummy3], type: '展開', hint: '基本公式 (x+a)(x+b) = x²+(a+b)x+ab を使います。' };
        } else if (type === 1) {
          const a = getRandomNonZero(-9, 9);
          const qText = `(x ${a>0?'+ '+a:'- '+Math.abs(a)})²`;
          const ans = `x²${fmtTerm(2*a, 'x')}${fmtTerm(a*a, '')}`;
          const dummy1 = `x²${fmtTerm(a, 'x')}${fmtTerm(a*a, '')}`;
          const dummy2 = `x²${fmtTerm(-2*a, 'x')}${fmtTerm(a*a, '')}`;
          const dummy3 = `x²${fmtTerm(a*a, '')}`;
          return { text: qText, answer: ans, dummies: [dummy1, dummy2, dummy3], type: '展開', hint: '平方の公式 (x+a)² = x²+2ax+a² です。' };
        } else {
          const a = Math.floor(Math.random() * 9) + 1;
          const qText = `(x + ${a})(x - ${a})`;
          const ans = `x²${fmtTerm(-a*a, '')}`;
          const dummy1 = `x²${fmtTerm(a*a, '')}`;
          const dummy2 = `x²${fmtTerm(-2*a, 'x')}${fmtTerm(-a*a, '')}`;
          const dummy3 = `x²${fmtTerm(2*a, 'x')}${fmtTerm(a*a, '')}`;
          return { text: qText, answer: ans, dummies: [dummy1, dummy2, dummy3], type: '展開', hint: '和と差の積 (x+a)(x-a) = x²-a² です。' };
        }
      } 
      else if (currentDifficulty === 'normal') {
        const type = Math.floor(Math.random() * 3);
        if (type === 0) {
          const a = Math.floor(Math.random() * 4) + 2;
          const c = Math.floor(Math.random() * 3) + 1;
          const b = getRandomNonZero(-6, 6);
          const d = getRandomNonZero(-6, 6);
          const qText = `(${fmtTerm(a,'x',true)} ${b>0?'+ '+b:'- '+Math.abs(b)})(${fmtTerm(c,'x',true)} ${d>0?'+ '+d:'- '+Math.abs(d)})`;
          const ans = `${fmtTerm(a*c,'x²',true)}${fmtTerm(a*d+b*c,'x')}${fmtTerm(b*d,'')}`;
          const dummy1 = `${fmtTerm(a*c,'x²',true)}${fmtTerm(a*b+c*d,'x')}${fmtTerm(b*d,'')}`;
          const dummy2 = `${fmtTerm(a*c,'x²',true)}${fmtTerm(a*d-b*c,'x')}${fmtTerm(b*d,'')}`;
          const dummy3 = `${fmtTerm(a+c,'x²',true)}${fmtTerm(a*d+b*c,'x')}${fmtTerm(b+d,'')}`;
          return { text: qText, answer: ans, dummies: [dummy1, dummy2, dummy3], type: '展開', hint: 'たすき掛け展開 (ax+b)(cx+d) = acx²+(ad+bc)x+bd です。' };
        } else if (type === 1) {
          const a = Math.floor(Math.random() * 3) + 2;
          const b = getRandomNonZero(-5, 5);
          const qText = `(${fmtTerm(a,'x',true)} ${b>0?'+ '+b:'- '+Math.abs(b)})²`;
          const ans = `${fmtTerm(a*a,'x²',true)}${fmtTerm(2*a*b,'x')}${fmtTerm(b*b,'')}`;
          const dummy1 = `${fmtTerm(a*a,'x²',true)}${fmtTerm(a*b,'x')}${fmtTerm(b*b,'')}`;
          const dummy2 = `${fmtTerm(a,'x²',true)}${fmtTerm(2*a*b,'x')}${fmtTerm(b*b,'')}`;
          const dummy3 = `${fmtTerm(a*a,'x²',true)}${fmtTerm(-2*a*b,'x')}${fmtTerm(b*b,'')}`;
          return { text: qText, answer: ans, dummies: [dummy1, dummy2, dummy3], type: '展開', hint: '(ax+b)² の展開です。' };
        } else {
          const a = getRandomNonZero(-5, 5);
          const b = getRandomNonZero(-5, 5);
          const qText = `(x ${a>0?'+ '+a:'- '+Math.abs(a)}y)(x ${b>0?'+ '+b:'- '+Math.abs(b)}y)`;
          const ans = `x²${fmtTerm(a+b, 'xy')}${fmtTerm(a*b, 'y²')}`;
          const dummy1 = `x²${fmtTerm(a-b, 'xy')}${fmtTerm(a*b, 'y²')}`;
          const dummy2 = `x²${fmtTerm(a+b, 'xy')}${fmtTerm(-a*b, 'y²')}`;
          const dummy3 = `x²${fmtTerm(a*b, 'xy')}${fmtTerm(a+b, 'y²')}`;
          return { text: qText, answer: ans, dummies: [dummy1, dummy2, dummy3], type: '展開', hint: '2変数yの和と積の展開です。' };

      else {
        const generators = [
          () => {

            const b = a + getRandomNonZero(1, 2);
            const c = a + 1;
            const d = b - 1;
            const qText = `(x + ${a})(x + ${b})(x + ${c})(x + ${d})`;
            const sum = a + b;

            const p2 = c * d;
            const ans = `x⁴${fmtTerm(2*sum,'x³')}${fmtTerm(sum*sum + p1 + p2,'x²')}${fmtTerm(sum*(p1+p2),'x')}${fmtTerm(p1*p2,'')}`;
            const dummy1 = `x⁴${fmtTerm(sum,'x³')}${fmtTerm(sum*sum + p1 + p2,'x²')}${fmtTerm(sum*(p1+p2),'x')}${fmtTerm(p1*p2,'')}`;
            const dummy2 = `x⁴${fmtTerm(2*sum,'x³')}${fmtTerm(p1 + p2,'x²')}${fmtTerm(sum*(p1+p2),'x')}${fmtTerm(p1*p2,'')}`;

            return {
              text: qText,
              answer: ans,
              dummies: [dummy1, dummy2, dummy3],

              hint: `【定数項の和の組み替え】(x+${a})(x+${b}) と (x+${c})(x+${d}) でペアを作り、x²+${sum}x を A と置きます。`
            };
          },
          () => {
            return {
              text: `(a + b + c)(ab + bc + ca)`,
              answer: `a²b+ab²+b²c+bc²+c²a+ca²+3abc`,
              dummies: [
                `a²b+ab²+b²c+bc²+c²a+ca²+abc`,
                `a²b+ab²+b²c+bc²+c²a+ca²`,
                `a³+b³+c³+3abc`
              ],
              type: '展開',
              hint: '【3変数対称式】1つの文字について整理して展開します。'
            };
          },
          () => {
            const k = getRandomNonZero(-4, 4);
            const qText = `(x + y ${k>0?'+ '+k:'- '+Math.abs(k)})²`;
            const ans = `x²+2xy+y²${fmtTerm(2*k,'x')}${fmtTerm(2*k,'y')}${fmtTerm(k*k,'')}`;
            const dummy1 = `x²+xy+y²${fmtTerm(2*k,'x')}${fmtTerm(2*k,'y')}${fmtTerm(k*k,'')}`;
            const dummy2 = `x²+2xy+y²${fmtTerm(k,'x')}${fmtTerm(k,'y')}${fmtTerm(k*k,'')}`;
            const dummy3 = `x²+2xy+y²${fmtTerm(-2*k,'x')}${fmtTerm(-2*k,'y')}${fmtTerm(k*k,'')}`;
            return {
              text: qText,
              answer: ans,
              dummies: [dummy1, dummy2, dummy3],
              type: '展開',
              hint: '【(a+b+c)²の公式】a²+b²+c²+2ab+2bc+2ca を使います。'
            };
          }
        ];
        const choice = generators[Math.floor(Math.random() * generators.length)];
        return choice();
      }
    }

    function generateUniqueFactorQuestion() {
      let q;
      let maxTry = 10;
      while (maxTry-- > 0) {
        q = makeFactorData();
        if (!recentQuestions.includes(q.text)) break;
      }
      recentQuestions.push(q.text);
      if (recentQuestions.length > 15) recentQuestions.shift();

    function makeFactorData() {
      if (currentDifficulty === 'easy') {
        const type = Math.floor(Math.random() * 3);
        if (type === 0) {
          const a = getRandomNonZero(-8, 8);
          const b = getRandomNonZero(-8, 8);
          const qText = `x²${fmtTerm(a+b,'x')}${fmtTerm(a*b,'')}`;
          const strA = a > 0 ? `+${a}` : `${a}`;
          const strB = b > 0 ? `+${b}` : `${b}`;
          const ansShow = `(x${strA})(x${strB})`;
          const dummy1 = `(x-${strA})(x${strB})`;
          const dummy2 = `(x${strA})(x-${strB})`;
          const dummy3 = `(x+${a+b})(x+${a*b})`;
          return { text: qText, answerValid: [`(x${strA})(x${strB})`, `(x${strB})(x${strA})`], answerShow: ansShow, dummies: [dummy1, dummy2, dummy3], type: '因数分解', hint: '和と積から2数を見つける基本パターンです。' };
        } else if (type === 1) {
          const a = Math.floor(Math.random() * 8) + 2;
          const qText = `x² - ${a*a}`;
          const ansShow = `(x+${a})(x-${a})`;
          const dummy1 = `(x-${a})²`;
          const dummy2 = `(x+${a})²`;
          const dummy3 = `(x+${a*a})(x-1)`;
          return { text: qText, answerValid: [`(x+${a})(x-${a})`, `(x-${a})(x+${a})`], answerShow: ansShow, dummies: [dummy1, dummy2, dummy3], type: '因数分解', hint: '二乗の差 x²-a² = (x+a)(x-a) です。' };
        } else {
          const a = getRandomNonZero(-7, 7);
          const qText = `x²${fmtTerm(2*a,'x')}${fmtTerm(a*a,'')}`;
          const strA = a > 0 ? `+${a}` : `${a}`;
          const ansShow = `(x${strA})²`;
          const dummy1 = `(x-${strA})²`;
          const dummy2 = `(x${strA})(x-${strA})`;
          const dummy3 = `(x+2${strA})²`;
          return { text: qText, answerValid: [`(x${strA})²`], answerShow: ansShow, dummies: [dummy1, dummy2, dummy3], type: '因数分解', hint: '完全平方 (x+a)² の形です。' };
        }
      } 
      else if (currentDifficulty === 'normal') {
        const type = Math.floor(Math.random() * 3);
        if (type === 0) {
          const a = Math.floor(Math.random() * 3) + 2;
          const c = Math.floor(Math.random() * 2) + 1;
          const b = getRandomNonZero(-5, 5);
          const d = getRandomNonZero(-5, 5);
          const qText = `${fmtTerm(a*c,'x²',true)}${fmtTerm(a*d+b*c,'x')}${fmtTerm(b*d,'')}`;
          const t1 = `${fmtTerm(a,'x',true)}${b>0?'+'+b:b}`;
          const t2 = `${fmtTerm(c,'x',true)}${d>0?'+'+d:d}`;
          const ansShow = `(${t1})(${t2})`;
          const dummy1 = `(${fmtTerm(a,'x',true)}${b>0?'-'+b:'+'+Math.abs(b)})(${t2})`;
          const dummy2 = `(${t1})(${fmtTerm(c,'x',true)}${d>0?'-'+d:'+'+Math.abs(d)})`;
          const dummy3 = `(${fmtTerm(a*c,'x',true)}+1)(x${b*d>0?'+'+b*d:b*d})`;
          return { text: qText, answerValid: [`(${t1})(${t2})`, `(${t2})(${t1})`], answerShow: ansShow, dummies: [dummy1, dummy2, dummy3], type: '因数分解', hint: 'たすき掛けを使って因数分解します。' };
        } else if (type === 1) {
          const m = Math.floor(Math.random() * 4) + 2;
          const a = getRandomNonZero(-5, 5);
          const b = getRandomNonZero(-5, 5);
          const qText = `${m}x²${fmtTerm(m*(a+b),'x')}${fmtTerm(m*a*b,'')}`;
          const strA = a > 0 ? `+${a}` : `${a}`;
          const strB = b > 0 ? `+${b}` : `${b}`;
          const ansShow = `${m}(x${strA})(x${strB})`;
          const dummy1 = `(x${strA})(${m}x${strB})`;
          const dummy2 = `${m}(x-${strA})(x${strB})`;
          const dummy3 = `(x${strA})(x${strB})`;
          return { text: qText, answerValid: [`${m}(x${strA})(x${strB})`, `${m}(x${strB})(x${strA})`], answerShow: ansShow, dummies: [dummy1, dummy2, dummy3], type: '因数分解', hint: '【共通因数】まず全項を共通因数で括り出します。' };
        } else {
          const a = getRandomNonZero(-5, 5);
          const b = getRandomNonZero(-5, 5);
          const qText = `x²${fmtTerm(a+b,'xy')}${fmtTerm(a*b,'y²')}`;
          const strA = a > 0 ? `+${a}` : `${a}`;
          const strB = b > 0 ? `+${b}` : `${b}`;
          const ansShow = `(x${strA}y)(x${strB}y)`;
          const dummy1 = `(x-${strA}y)(x${strB}y)`;
          const dummy2 = `(x${strA}y)(x-${strB}y)`;
          const dummy3 = `(x+y)(x${a*b>0?'+'+a*b:a*b}y)`;
          return { text: qText, answerValid: [`(x${strA}y)(x${strB}y)`, `(x${strB}y)(x${strA}y)`], answerShow: ansShow, dummies: [dummy1, dummy2, dummy3], type: '因数分解', hint: 'yを含んだ形の和と積の因数分解です。' };
        }
      } 
      else {
        const generators = [
          () => {
            return {
              text: `x⁴ + 4y⁴`,
              answerValid: [`(x²+2xy+2y²)(x²-2xy+2y²)`, `(x²-2xy+2y²)(x²+2xy+2y²)`],
              answerShow: `(x²+2xy+2y²)(x²-2xy+2y²)`,
              dummies: [
                `(x²+2y²)(x²-2y²)`,
                `(x²+4xy+2y²)(x²-4xy+2y²)`,
                `(x²+2xy-2y²)(x²-2xy-2y²)`
              ],
              type: '因数分解',
              hint: '【数を足して引く】4x²y² を足して引くことで (x²+2y²)² - (2xy)² を作ります。'
            };
          },
          () => {
            return {
              text: `2x² + 5xy + 2y² + 4x + 5y + 2`,
              answerValid: [`(x+2y+1)(2x+y+2)`, `(2x+y+2)(x+2y+1)`],
              answerShow: `(x+2y+1)(2x+y+2)`,
              dummies: [
                `(x+2y+2)(2x+y+1)`,
                `(x-2y+1)(2x-y+2)`,
                `(2x+2y+1)(x+y+2)`
              ],
              type: '因数分解',
              hint: '【降べきの順】x について整理し、定数項を因数分解してから全体のたすき掛けを行います。'
            };
          }
        ];
        const choice = generators[Math.floor(Math.random() * generators.length)];
        return choice();
      }
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startGame(mode) {
      isRetryMode = false;
      currentMode = mode;
      qIndex = 1;
      totalQuestionsInGame = 10;
      setupGameUI();
      nextQuestion();
    }

    function startRetryMode() {
      const mistakes = JSON.parse(localStorage.getItem('math_mistakes') || '[]');
      if (mistakes.length === 0) return;

      isRetryMode = true;
      retryQuestions = mistakes;
      qIndex = 1;
      totalQuestionsInGame = retryQuestions.length;
      setupGameUI('復習');
      nextQuestion();
    }

    function setupGameUI(diffOverride) {
      document.getElementById('mode-select').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('q-num').innerText = qIndex;
      document.getElementById('q-total').innerText = totalQuestionsInGame;
      
      const diffNames = { easy: '初級', normal: '中級', hard: '上級 (構造・変形)' };
      document.getElementById('diff-label').innerText = diffOverride || diffNames[currentDifficulty];

      if (inputStyle === 'choice') {
        document.getElementById('choice-answer-area').classList.remove('hidden');
        document.getElementById('keyboard-answer-area').classList.add('hidden');
      } else {
        document.getElementById('choice-answer-area').classList.add('hidden');
        document.getElementById('keyboard-answer-area').classList.remove('hidden');
      }
      
      startTime = Date.now();
      timerInterval = setInterval(() => {
        document.getElementById('timer').innerText = ((Date.now() - startTime) / 1000).toFixed(1);
      }, 100);
    }

    function nextQuestion() {
      document.getElementById('feedback').innerText = '';
      document.getElementById('answer-input').value = '';
      document.getElementById('hint-box').classList.add('hidden');

      if (isRetryMode) {
        currentQuestionData = retryQuestions[qIndex - 1];
        document.getElementById('mode-label').innerText = currentQuestionData.type === '展開' ? '展開しなさい' : '因数分解しなさい';
      } else {
        currentQuestionData = currentMode === 'expand' ? generateUniqueExpandQuestion() : generateUniqueFactorQuestion();
        document.getElementById('mode-label').innerText = currentMode === 'expand' ? '展開しなさい' : '因数分解しなさい';
      }
      document.getElementById('question').innerText = currentQuestionData.text;

      if (inputStyle === 'choice') {
        const correctAns = currentQuestionData.type === '展開' ? currentQuestionData.answer : currentQuestionData.answerShow;
        const allOpts = [correctAns, ...currentQuestionData.dummies];
        currentChoices = shuffleArray(allOpts);

        for (let i = 0; i < 4; i++) {
          const btn = document.getElementById(`choice-${i}`);
          btn.innerText = currentChoices[i];
        }
      } else {
        document.getElementById('answer-input').focus();
      }
    }

    function normalize(str) { 
      return str
        .replace(/\s+/g, '')
        .toLowerCase()
        .replace(/\^2/g, '²')
        .replace(/\^3/g, '³')
        .replace(/\^4/g, '⁴')
        .replace(/a2/g, 'a²').replace(/b2/g, 'b²').replace(/c2/g, 'c²')
        .replace(/x2/g, 'x²').replace(/y2/g, 'y²').replace(/z2/g, 'z²')
        .replace(/x3/g, 'x³').replace(/x4/g, 'x⁴');
    }

    function parseTerms(str) {
      let norm = normalize(str);
      if (norm[0] !== '+' && norm[0] !== '-') norm = '+' + norm;
      const terms = norm.match(/[+-][^+-]+/g) || [];
      return terms.map(t => {
        return t.replace(/\+1(?=[a-z²³⁴])/, '+').replace(/\-1(?=[a-z²³⁴])/, '-');
      }).sort();
    }

    function comparePolynomials(user, target) {
      const uTerms = parseTerms(user);
      const tTerms = parseTerms(target);
      if (uTerms.length !== tTerms.length) return false;
      return uTerms.every((term, idx) => term === tTerms[idx]);
    }

    function selectChoice(index) {
      const userAns = currentChoices[index];
      processAnswer(userAns);
    }

    function checkAnswer() {
      const inputEl = document.getElementById('answer-input');
      const userRaw = inputEl.value;
      if (!userRaw.trim()) return;
      processAnswer(userRaw);
    }

    function processAnswer(userAns) {
      incrementTotalQuestions();

      let isCorrect = false;

      if (currentQuestionData.type === '展開') {
        isCorrect = comparePolynomials(userAns, currentQuestionData.answer);
      } else {
        const normUser = normalize(userAns);
        isCorrect = currentQuestionData.answerValid.some(ans => normUser === normalize(ans));
      }

      playSound(isCorrect ? 'correct' : 'wrong');
      triggerVisualFeedback(isCorrect);

      if (isCorrect) {
        if (isRetryMode) {
          removeMistake(currentQuestionData);
        }

        setTimeout(() => {
          if (qIndex < totalQuestionsInGame) {
            qIndex++;
            document.getElementById('q-num').innerText = qIndex;
            nextQuestion();
          } else {
            finishGame();
          }
        }, 350);
      } else {
        if (!isRetryMode) {
          saveMistake(currentQuestionData);
        }
        if (currentQuestionData.hint) {
          document.getElementById('hint-text').innerText = currentQuestionData.hint;
          document.getElementById('hint-box').classList.remove('hidden');
        }
        if (inputStyle === 'keyboard') {
          const inputEl = document.getElementById('answer-input');
          inputEl.value = '';
          inputEl.focus();
        }
      }
    }

    function saveMistake(qData) {
      let mistakes = JSON.parse(localStorage.getItem('math_mistakes') || '[]');
      if (!mistakes.some(m => m.text === qData.text)) {
        mistakes.push(qData);
        localStorage.setItem('math_mistakes', JSON.stringify(mistakes));
      }
    }

    function removeMistake(qData) {
      let mistakes = JSON.parse(localStorage.getItem('math_mistakes') || '[]');
      mistakes = mistakes.filter(m => m.text !== qData.text);
      localStorage.setItem('math_mistakes', JSON.stringify(mistakes));
    }

    function incrementTotalQuestions() {
      let count = parseInt(localStorage.getItem('math_total_q') || '0', 10);
      localStorage.setItem('math_total_q', (count + 1).toString());
    }

    function finishGame() {
      clearInterval(timerInterval);
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      
      if (!isRetryMode) {
        saveRecord(elapsed);
        alert(`🎉 クリア！ タイム: ${elapsed}秒`);
      } else {
        alert(`🎉 復習完了！ ミス問題を克服しました！`);
      }
      showHome();
    }

    function saveRecord(time) {
      let records = JSON.parse(localStorage.getItem('math_records') || '[]');
      records.push(parseFloat(time));
      localStorage.setItem('math_records', JSON.stringify(records));
    }

    function showWorksheet() {
      document.getElementById('mode-select').classList.add('hidden');
      document.getElementById('worksheet-screen').classList.remove('hidden');
      generateSheet('mix');
    }

    function generateSheet(type) {
      currentSheetData = [];
      showAnswersFlag = false;
      document.getElementById('toggle-ans-btn').innerText = '答えと解説を表示する';

      for (let i = 0; i < 10; i++) {
        let q;
        if (type === 'expand') q = generateUniqueExpandQuestion();
        else if (type === 'factor') q = generateUniqueFactorQuestion();
        else q = Math.random() > 0.5 ? generateUniqueExpandQuestion() : generateUniqueFactorQuestion();
        currentSheetData.push(q);
      }
      renderSheet();
    }

    function renderSheet() {
      const container = document.getElementById('sheet-list');
      container.innerHTML = '';

      currentSheetData.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'print-card bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-col gap-2';
        const ansText = item.type === '展開' ? item.answer : item.answerShow;

        card.innerHTML = `
          <div class="flex justify-between items-center text-xs font-semibold text-slate-400">
            <span>問 ${idx + 1} [${item.type}]</span>
          </div>
          <div class="text-lg font-bold text-slate-900 dark:text-indigo-200 py-1">${item.text}</div>
          <div class="sheet-ans text-emerald-600 dark:text-emerald-400 font-mono font-bold text-sm pt-2 border-t border-slate-100 dark:border-slate-800 space-y-1 ${showAnswersFlag ? '' : 'hidden'}">
            <div>答: ${ansText}</div>
            <div class="text-xs font-normal text-slate-500 dark:text-slate-400">💡 ポイント: ${item.hint || '基本変形'}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleAnswers() {
      showAnswersFlag = !showAnswersFlag;
      document.getElementById('toggle-ans-btn').innerText = showAnswersFlag ? '答えと解説を隠す' : '答えと解説を表示する';
      renderSheet();
    }

    function showDashboard() {
      document.getElementById('mode-select').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      
      let totalQ = localStorage.getItem('math_total_q') || '0';
      document.getElementById('total-questions').innerText = `${totalQ} 問`;

      let records = JSON.parse(localStorage.getItem('math_records') || '[]');
      document.getElementById('total-plays').innerText = `${records.length} 回`;
      if (records.length > 0) {
        document.getElementById('best-time').innerText = `${Math.min(...records).toFixed(1)} 秒`;
        document.getElementById('avg-time').innerText = `${(records.reduce((a, b) => a + b, 0) / records.length).toFixed(1)} 秒`;
      }
    }

    function confirmQuit() {
      const gameScreen = document.getElementById('game-screen');
      if (!gameScreen.classList.contains('hidden')) {
        if (confirm('途中退出しますか？（現在のタイムは記録されません）')) {
          showHome();
        }
      } else {
        showHome();
      }
    }

    function showHome() {
      if (timerInterval) clearInterval(timerInterval);
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('worksheet-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.add('hidden');
      document.getElementById('mode-select').classList.remove('hidden');
      updateMistakeBadge();
    }

    updateMistakeBadge();
  </script>
</body>
</html>
